# Snippet for OpenResty/nginx in front of the Vite `dist/` folder.
# Adjust root and include from your server {} block.
#
#   root /var/www/sergio-dev.com/dist;
#   include /path/to/deploy/nginx-sergio-dev.conf;

map $http_accept $sergio_rep {
    default html;
    "~*text/markdown" md;
}

# Prefer explicit q-values when both markdown and html appear
map $http_accept $sergio_rep_md {
    default 0;
    "~*text/markdown" 1;
}

add_header Vary Accept always;

location = / {
    if ($sergio_rep = md) {
        default_type text/markdown;
        add_header Vary Accept always;
        try_files /index.md =404;
    }
    try_files /index.html =404;
}

location ~ ^/(about|work|thoughts|contact|privacy)/?$ {
    set $slug $1;
    if ($sergio_rep = md) {
        default_type text/markdown;
        add_header Vary Accept always;
        try_files /$slug.md =404;
    }
    try_files /$slug/index.html =404;
}

location = /404.md {
    default_type text/markdown;
    internal;
}

error_page 404 @sergio404;

location @sergio404 {
    if ($sergio_rep = md) {
        default_type text/markdown;
        add_header Vary Accept always;
        return 404 '---\n# Página no encontrada\n\nConsulta https://sergio-dev.com/llms.txt y https://sergio-dev.com/sitemap.xml\n';
    }
    try_files /404.html =404;
}

location / {
    try_files $uri $uri/ $uri/index.html =404;
}

location = /llms.txt {
    default_type text/plain;
    charset utf-8;
}

location ~* \.(md|xml|txt)$ {
    add_header Vary Accept always;
}
